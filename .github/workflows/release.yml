name: release

# Tag a commit `vX.Y.Z` (the version in source.extension.vsixmanifest) to build the VSIX and publish it as a GitHub
# Release whose notes are the CHANGELOG section of that version.
on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Release notes (the tag must name the version)
        shell: pwsh
        run: |
          ./tools/release-notes.ps1 -Tag $env:GITHUB_REF_NAME -OutFile release-notes.md
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $footer = "`n---`n`nDownload ``SsmsSharedQueries.vsix`` below.`n`nNote: Microsoft does not officially support third-party extensions in SSMS 21/22, so install per-machine and see the README for details.`n"
          [IO.File]::AppendAllText("$PWD/release-notes.md", $footer)

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v3

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore (extension)
        run: msbuild src/SsmsSharedQueries/SsmsSharedQueries.csproj /t:Restore /p:Configuration=Release /v:minimal /nologo

      - name: Build VSIX
        run: msbuild src/SsmsSharedQueries/SsmsSharedQueries.csproj /p:Configuration=Release /p:DeployExtension=false /v:minimal /nologo

      - name: Test
        run: dotnet test tests/SsmsSharedQueries.Tests/SsmsSharedQueries.Tests.csproj -c Release --verbosity normal

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: src/SsmsSharedQueries/bin/Release/SsmsSharedQueries.vsix
          body_path: release-notes.md
